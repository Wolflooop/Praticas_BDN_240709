name: examen_${STUDENT_ID:?Configura STUDENT_ID}

services:
  # ============================================================
  # MYSQL
  # ============================================================
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    init: true
    stop_grace_period: 1m

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_test_7b}
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      TZ: America/Mexico_City

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=100

    ports:
      - "${HOST_BIND:-0.0.0.0}:${MYSQL_PORT:?Configura MYSQL_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - mysql_network

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================
  # POSTGRESQL
  # ============================================================
  postgres:
    image: postgres:17
    restart: unless-stopped
    init: true
    stop_grace_period: 1m

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-db_test_7b}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City

    ports:
      - "${HOST_BIND:-0.0.0.0}:${POSTGRES_PORT:?Configura POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - postgres_network

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================
  # PGADMIN WEB
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    init: true

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Configura PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Configura PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      TZ: America/Mexico_City

    ports:
      - "${HOST_BIND:-0.0.0.0}:${PGADMIN_PORT:?Configura PGADMIN_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - postgres_network

    depends_on:
      postgres:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================
  # PHPMYADMIN WEB
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    init: true

    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 64M
      TZ: America/Mexico_City

    ports:
      - "${HOST_BIND:-0.0.0.0}:${PHPMYADMIN_PORT:?Configura PHPMYADMIN_PORT}:80"

    networks:
      - mysql_network

    depends_on:
      mysql:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ============================================================
# VOLUMENES PERSISTENTES EXCLUSIVOS DE ESTE PROYECTO
# ============================================================
volumes:
  mysql_data:
  postgres_data:
  pgadmin_data:

# ============================================================
# REDES INDEPENDIENTES
# ============================================================
networks:
  mysql_network:
    driver: bridge

  postgres_network:
    driver: bridge
