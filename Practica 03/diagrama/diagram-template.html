function applySearch(){searchTerm=search.value.trim().toLowerCase();const matches=new Set(),fieldMatches=new Map();world.querySelectorAll('.entity').forEach(g=>{const t=node(g.dataset.table),tableHit=`${t.name} ${t.title} ${t.description}`.toLowerCase().includes(searchTerm),rows=[...g.querySelectorAll('.rowbg')],hitFields=new Set();let hit=tableHit;rows.forEach((row,i)=>{const c=t.columns[i],match=!searchTerm||tableHit||`${c.name} ${c.type} ${c.description}`.toLowerCase().includes(searchTerm);row.classList.toggle('match',!!searchTerm&&!tableHit&&match);row.classList.toggle('dim',!!searchTerm&&!tableHit&&!match);if(match)hit=true;if(match&&!tableHit)hitFields.add(c.name)});if(hit){matches.add(t.name);if(hitFields.size)fieldMatches.set(t.name,hitFields)}});visibleTables=new Set(matches);if(searchTerm)MODEL.relationships.forEach(r=>{if(matches.has(r.sourceTable))visibleTables.add(r.targetTable);if(matches.has(r.targetTable))visibleTables.add(r.sourceTable)});world.querySelectorAll('.entity').forEach(g=>g.classList.toggle('hidden',!visibleTables.has(g.dataset.table)));world.querySelectorAll('.edge').forEach(g=>{const r=MODEL.relationships.find(x=>x.id===g.dataset.rel),show=document.querySelector('#relations').checked&&(!searchTerm||(visibleTables.has(r.sourceTable)&&visibleTables.has(r.targetTable)));g.style.display=show?'':'none'});const status=document.querySelector('#matches');status.textContent=searchTerm?`${matches.size} tabla${matches.size===1?'':'s'} encontrada${matches.size===1?'':'s'}${matches.size>0?' · vecinas para contexto':''}`:'';if(searchTerm&&matches.size===1){const name=[...matches][0];selectedRelation=null;selectedTable=name;renderTablePanel(name);focusTable(name)}else if(selectedTable&&!visibleTables.has(selectedTable)){selectedTable=null;renderGuide()}applySelection();return {matches,fieldMatches}}
function applySelection(){const groupView=!selectedTable&&!selectedRelation&&!searchTerm&&visibleTables.size===MODEL.tables.length&&document.querySelector('#relations').checked;world.classList.toggle('group-view',groupView);const direct=new Set();if(selectedRelation){const r=MODEL.relationships.find(x=>x.id===selectedRelation);if(r){direct.add(r.sourceTable);direct.add(r.targetTable)}}else if(selectedTable){direct.add(selectedTable);MODEL.relationships.forEach(r=>{if(r.sourceTable===selectedTable)direct.add(r.targetTable);if(r.targetTable===selectedTable)direct.add(r.sourceTable)})}world.querySelectorAll('.entity').forEach(g=>{const name=g.dataset.table,selected=selectedRelation?direct.has(name):name===selectedTable;g.classList.toggle('selected',selected);g.classList.toggle('connected',!!(selectedTable||selectedRelation)&&direct.has(name)&&!selected);g.classList.toggle('dimmed',!!(selectedTable||selectedRelation)&&!direct.has(name));g.querySelectorAll('.rowbg').forEach(row=>{const n=row.dataset.col,highlight=selectedRelation?(()=>{const r=MODEL.relationships.find(x=>x.id===selectedRelation);return r&&((name===r.sourceTable&&r.sourceColumns.includes(n))||(name===r.targetTable&&r.targetColumns.includes(n)))} )():selectedTable?MODEL.relationships.some(r=>(r.sourceTable===selectedTable&&r.sourceTable===name&&r.sourceColumns.includes(n))||(r.targetTable===selectedTable&&r.targetTable===name&&r.targetColumns.includes(n))):false;row.classList.toggle('highlight',!!highlight)})});world.querySelectorAll('.edge').forEach(g=>{const r=MODEL.relationships.find(x=>x.id===g.dataset.rel),active=selectedRelation===r.id||(!selectedRelation&&selectedTable&&(r.sourceTable===selectedTable||r.targetTable===selectedTable));g.classList.toggle('selected',selectedRelation===r.id);g.classList.toggle('outgoing',!!selectedTable&&r.sourceTable===selectedTable);g.classList.toggle('incoming',!!selectedTable&&r.targetTable===selectedTable);g.classList.toggle('dimmed',!!(selectedTable||selectedRelation)&&!active);g.querySelector('.rel').classList.toggle('active',!!active)})}
function bindPanelButtons(){panel.querySelectorAll('[data-rel]').forEach(b=>b.addEventListener('click',()=>selectRelation(b.dataset.rel)));panel.querySelectorAll('[data-table]').forEach(b=>b.addEventListener('click',()=>selectTable(b.dataset.table,{focus:true})))}
function renderGuide(){stopTour();selectedTable=null;selectedRelation=null;tourButton.disabled=true;const groupsHtml=groups.map(([label,names])=>{const available=names.filter(node);return `<div class="guide-card"><strong>${esc(label)}</strong><p>${available.map(n=>`<button class="relation-button" data-table="${esc(n)}">${esc(n)}</button>`).join('')}</p></div>`}).join('');panel.innerHTML=`<span class="eyebrow">Guía del modelo</span><h2>Cómo leer el diagrama</h2><p>El esquema agrupa ${MODEL.summary.tables} tablas y ${MODEL.summary.columns} columnas. Las líneas sólidas corresponden a las ${MODEL.summary.foreignKeys} restricciones FOREIGN KEY declaradas en el respaldo.</p><h3>Organización</h3><p>Estos grupos son una guía basada en nombres de tablas y FKs. No añaden relaciones ni reglas de negocio.</p>${groupsHtml}<h3>Claves e integridad</h3><p><span class="chip pk">PK</span> identifica una fila; algunas claves primarias abarcan varias columnas. <span class="chip fk">FK</span> referencia una clave en otra tabla y MySQL comprueba que el destino exista. La nulabilidad y los índices únicos determinan si la referencia puede faltar y cuántas filas pueden compartirla.</p><p>Las cardinalidades junto a una relación muestran la participación máxima y la nulabilidad que permite el DDL. Los CHECK y las acciones referenciales se consultan al seleccionar una relación o tabla. “Recorrer relaciones” anima las FK declaradas de la tabla seleccionada, sin simular registros.</p><h3>Nota del esquema</h3><p><code>tb_logs.record_id</code> no tiene FK declarada en este respaldo; por eso su posible referencia a otras filas no aparece como conexión.</p>`;applySelection();bindPanelButtons()}
function renderTablePanel(name){const t=node(name),out=MODEL.relationships.filter(r=>r.sourceTable===name),incoming=MODEL.relationships.filter(r=>r.targetTable===name),checks=t.constraints.filter(c=>c.type==='CHECK'),indexes=t.indexes.filter(i=>i.kind!=='PRIMARY');panel.innerHTML=`<span class="eyebrow">Tabla · ${t.columns.length} columnas</span><h2>${esc(t.name)}</h2><p><strong>${esc(t.title)}</strong></p><p>${esc(t.description)}</p><div class="panel-actions"><button class="btn" id="panelGuide">Guía general</button><button class="btn" id="panelClear">Quitar resaltado</button></div><dl><dt>Clave primaria</dt><dd>${esc(t.primaryKey.join(', ')||'No declarada')}</dd><dt>Índices únicos</dt><dd>${indexes.filter(i=>i.kind==='UNIQUE').map(i=>esc(i.name)).join(', ')||'Ninguno'}</dd><dt>Restricciones CHECK</dt><dd>${checks.length?checks.map(c=>esc(c.name)).join(', '):'Ninguna'}</dd></dl><h3>Columnas</h3><div class="column-list">${t.columns.map(c=>`<div class="item"><b>${esc(c.name)}</b> ${c.keys.map(k=>`<span class="chip ${k==='PK'?'pk':k==='FK'?'fk':''}">${esc(k)}</span>`).join('')}<small>${esc(c.description)}<br>${esc(c.type)} · ${c.nullable?'NULL':'NOT NULL'}${c.default!==null?' · DEFAULT '+esc(c.default):''}${c.autoIncrement?' · AUTO_INCREMENT':''}</small></div>`).join('')}</div><h3>Relaciones salientes (${out.length})</h3>${out.map(r=>`<button class="relation-button" data-rel="${esc(r.id)}"><span class="direction out">SALE</span> ${esc(r.constraint)} → ${esc(r.targetTable)}.${esc(r.targetColumns.join(', '))}</button>`).join('')||'<p>Sin FKs salientes.</p>'}<h3>Relaciones entrantes (${incoming.length})</h3>${incoming.map(r=>`<button class="relation-button" data-rel="${esc(r.id)}"><span class="direction in">ENTRA</span> ${esc(r.constraint)} ← ${esc(r.sourceTable)}.${esc(r.sourceColumns.join(', '))}</button>`).join('')||'<p>Sin FKs entrantes.</p>'}<h3>Índices</h3><p>${indexes.map(i=>`<span class="chip">${esc(i.name)} (${esc(i.columns.join(', '))})${i.kind==='UNIQUE'?' · UNIQUE':''}</span>`).join('')||'Sin índices secundarios.'}</p>`;panel.querySelector('#panelGuide').onclick=renderGuide;panel.querySelector('#panelClear').onclick=()=>{selectedTable=null;selectedRelation=null;applySelection();renderGuide()};applySelection();bindPanelButtons()}
function selectTable(name,{focus=false}={}){if(!node(name))return;stopTour();selectedTable=name;selectedRelation=null;tourRelations=MODEL.relationships.filter(r=>r.sourceTable===name||r.targetTable===name);tourIndex=-1;tourButton.disabled=!tourRelations.length;renderTablePanel(name);if(focus)focusTable(name)}
function selectRelation(id,{fromTour=false}={}){const r=MODEL.relationships.find(x=>x.id===id);if(!r)return;if(!fromTour){stopTour();tourButton.disabled=true}selectedTable=null;selectedRelation=id;const fields=r.sourceColumns.map((c,i)=>`${r.sourceTable}.${c} → ${r.targetTable}.${r.targetColumns[i]}`).join('<br>');panel.innerHTML=`<span class="eyebrow">Relación declarada · FOREIGN KEY${fromTour?' · Recorrido estructural':''}</span><h2>${esc(r.constraint)}</h2><p>${esc(r.description)}</p><dl><dt>Origen</dt><dd>${esc(r.sourceTable)}</dd><dt>Columna(s)</dt><dd>${fields}</dd><dt>Destino</dt><dd>${esc(r.targetTable)}.${esc(r.targetColumns.join(', '))}</dd><dt>Cardinalidad</dt><dd>${esc(r.cardinality)}</dd><dt>ON DELETE</dt><dd>${esc(r.onDelete)}</dd><dt>ON UPDATE</dt><dd>${esc(r.onUpdate)}</dd></dl><div class="panel-actions"><button class="btn" id="sourceTable">Ver origen</button><button class="btn" id="targetTable">Ver destino</button><button class="btn" id="clearRelation">Quitar resaltado</button></div><p>El recorrido resalta la FK y la clave referenciada según el DDL; no simula filas ni consultas. Las columnas se muestran en el mismo orden que la restricción SQL.</p>`;panel.querySelector('#sourceTable').onclick=()=>selectTable(r.sourceTable,{focus:true});panel.querySelector('#targetTable').onclick=()=>selectTable(r.targetTable,{focus:true});panel.querySelector('#clearRelation').onclick=()=>{selectedRelation=null;applySelection();renderGuide()};applySelection();world.querySelectorAll('.edge.touring').forEach(e=>e.classList.remove('touring'));if(fromTour)world.querySelector(`.edge[data-rel="${CSS.escape(r.id)}"]`)?.classList.add('touring');focusRelation(r)}
function startDrag(e){if(e.button!==0)return;e.stopPropagation();const g=e.currentTarget,name=g.dataset.table,p=positions.get(name),start={x:e.clientX,y:e.clientY,px:p.x,py:p.y};let moved=false;g.setPointerCapture(e.pointerId);const move=ev=>{const dx=ev.clientX-start.x,dy=ev.clientY-start.y;if(!moved&&Math.hypot(dx,dy)<3)return;moved=true;autoFit=false;positions.set(name,{x:start.px+dx/view.scale,y:start.py+dy/view.scale});g.setAttribute('transform',`translate(${positions.get(name).x} ${positions.get(name).y})`);renderEdges();applySelection()};const done=()=>{g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',done);g.removeEventListener('pointercancel',done);if(!moved)selectTable(name,{focus:true})};g.addEventListener('pointermove',move);g.addEventListener('pointerup',done);g.addEventListener('pointercancel',done)}
function renderEdges(){world.querySelectorAll('.edge').forEach(e=>e.remove());world.insertAdjacentHTML('afterbegin',MODEL.relationships.map(edgeSvg).join(''));world.querySelectorAll('.edge').forEach(g=>{g.addEventListener('click',e=>{e.stopPropagation();selectRelation(g.dataset.rel)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectRelation(g.dataset.rel)}});const r=MODEL.relationships.find(x=>x.id===g.dataset.rel);g.style.display=document.querySelector('#relations').checked&&(!searchTerm||(visibleTables.has(r.sourceTable)&&visibleTables.has(r.targetTable)))?'':'none'});applySelection()}
function zoom(f,clientX,clientY){autoFit=false;const r=canvas.getBoundingClientRect(),px=clientX===undefined?r.width/2:clientX-r.left,py=clientY===undefined?r.height/2:clientY-r.top,worldX=(px-view.x)/view.scale,worldY=(py-view.y)/view.scale;view.scale=Math.max(.12,Math.min(1.8,view.scale*f));view.x=px-worldX*view.scale;view.y=py-worldY*view.scale;applyView()}
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.entity,.edge'))return;pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};canvas.setPointerCapture(e.pointerId);svg.classList.add('dragging')});canvas.addEventListener('pointermove',e=>{if(!pan)return;autoFit=false;view.x=pan.vx+e.clientX-pan.x;view.y=pan.vy+e.clientY-pan.y;applyView()});const stopPan=()=>{pan=null;svg.classList.remove('dragging')};canvas.addEventListener('pointerup',stopPan);canvas.addEventListener('pointercancel',stopPan);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
document.querySelector('#zoomIn').onclick=()=>zoom(1.2);document.querySelector('#zoomOut').onclick=()=>zoom(.84);document.querySelector('#fit').onclick=()=>fitView();document.querySelector('#reset').onclick=()=>{stopTour();orderedTables=layoutInitial();search.value='';selectedTable=null;selectedRelation=null;render();fitView();renderGuide()};document.querySelector('#showAll').onclick=()=>{search.value='';selectedTable=null;selectedRelation=null;document.querySelector('#relations').checked=true;applySearch();fitView();renderGuide()};document.querySelector('#guide').onclick=renderGuide;document.querySelector('#panelToggle').onclick=e=>{const closed=workspace.classList.toggle('panel-closed');e.currentTarget.setAttribute('aria-expanded',String(!closed));e.currentTarget.textContent=closed?'Mostrar panel':'Ocultar panel'};search.addEventListener('input',()=>{const result=applySearch();if(result.matches.size===1)selectedRelation=null;tourButton.disabled=!selectedTable||!MODEL.relationships.some(r=>r.sourceTable===selectedTable||r.targetTable===selectedTable)});document.querySelector('#relations').addEventListener('change',applySearch);render();renderGuide();requestAnimationFrame(()=>fitView());if('ResizeObserver'in window){new ResizeObserver(()=>{if(autoFit)fitView()}).observe(canvas)}
</script></body></html>
