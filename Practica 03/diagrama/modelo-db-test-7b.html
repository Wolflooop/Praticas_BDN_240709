function selectRelation(id,{fromTour=false}={}){const r=MODEL.relationships.find(x=>x.id===id);if(!r)return;if(!fromTour){stopTour();tourButton.disabled=true}selectedTable=null;selectedRelation=id;const fields=r.sourceColumns.map((c,i)=>`${r.sourceTable}.${c} → ${r.targetTable}.${r.targetColumns[i]}`).join('<br>');panel.innerHTML=`<span class="eyebrow">Relación declarada · FOREIGN KEY${fromTour?' · Recorrido estructural':''}</span><h2>${esc(r.constraint)}</h2><p>${esc(r.description)}</p><dl><dt>Origen</dt><dd>${esc(r.sourceTable)}</dd><dt>Columna(s)</dt><dd>${fields}</dd><dt>Destino</dt><dd>${esc(r.targetTable)}.${esc(r.targetColumns.join(', '))}</dd><dt>Cardinalidad</dt><dd>${esc(r.cardinality)}</dd><dt>ON DELETE</dt><dd>${esc(r.onDelete)}</dd><dt>ON UPDATE</dt><dd>${esc(r.onUpdate)}</dd></dl><div class="panel-actions"><button class="btn" id="sourceTable">Ver origen</button><button class="btn" id="targetTable">Ver destino</button><button class="btn" id="clearRelation">Quitar resaltado</button></div><p>El recorrido resalta la FK y la clave referenciada según el DDL; no simula filas ni consultas. Las columnas se muestran en el mismo orden que la restricción SQL.</p>`;panel.querySelector('#sourceTable').onclick=()=>selectTable(r.sourceTable,{focus:true});panel.querySelector('#targetTable').onclick=()=>selectTable(r.targetTable,{focus:true});panel.querySelector('#clearRelation').onclick=()=>{selectedRelation=null;applySelection();renderGuide()};applySelection();world.querySelectorAll('.edge.touring').forEach(e=>e.classList.remove('touring'));if(fromTour)world.querySelector(`.edge[data-rel="${CSS.escape(r.id)}"]`)?.classList.add('touring');focusRelation(r)}
function startDrag(e){if(e.button!==0)return;e.stopPropagation();const g=e.currentTarget,name=g.dataset.table,p=positions.get(name),start={x:e.clientX,y:e.clientY,px:p.x,py:p.y};let moved=false;g.setPointerCapture(e.pointerId);const move=ev=>{const dx=ev.clientX-start.x,dy=ev.clientY-start.y;if(!moved&&Math.hypot(dx,dy)<3)return;moved=true;autoFit=false;positions.set(name,{x:start.px+dx/view.scale,y:start.py+dy/view.scale});g.setAttribute('transform',`translate(${positions.get(name).x} ${positions.get(name).y})`);renderEdges();applySelection()};const done=()=>{g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',done);g.removeEventListener('pointercancel',done);if(!moved)selectTable(name,{focus:true})};g.addEventListener('pointermove',move);g.addEventListener('pointerup',done);g.addEventListener('pointercancel',done)}
function renderEdges(){world.querySelectorAll('.edge').forEach(e=>e.remove());world.insertAdjacentHTML('afterbegin',MODEL.relationships.map(edgeSvg).join(''));world.querySelectorAll('.edge').forEach(g=>{g.addEventListener('click',e=>{e.stopPropagation();selectRelation(g.dataset.rel)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectRelation(g.dataset.rel)}});const r=MODEL.relationships.find(x=>x.id===g.dataset.rel);g.style.display=document.querySelector('#relations').checked&&(!searchTerm||(visibleTables.has(r.sourceTable)&&visibleTables.has(r.targetTable)))?'':'none'});applySelection()}
function zoom(f,clientX,clientY){autoFit=false;const r=canvas.getBoundingClientRect(),px=clientX===undefined?r.width/2:clientX-r.left,py=clientY===undefined?r.height/2:clientY-r.top,worldX=(px-view.x)/view.scale,worldY=(py-view.y)/view.scale;view.scale=Math.max(.12,Math.min(1.8,view.scale*f));view.x=px-worldX*view.scale;view.y=py-worldY*view.scale;applyView()}
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.entity,.edge'))return;pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};canvas.setPointerCapture(e.pointerId);svg.classList.add('dragging')});canvas.addEventListener('pointermove',e=>{if(!pan)return;autoFit=false;view.x=pan.vx+e.clientX-pan.x;view.y=pan.vy+e.clientY-pan.y;applyView()});const stopPan=()=>{pan=null;svg.classList.remove('dragging')};canvas.addEventListener('pointerup',stopPan);canvas.addEventListener('pointercancel',stopPan);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
document.querySelector('#zoomIn').onclick=()=>zoom(1.2);document.querySelector('#zoomOut').onclick=()=>zoom(.84);document.querySelector('#fit').onclick=()=>fitView();document.querySelector('#reset').onclick=()=>{stopTour();orderedTables=layoutInitial();search.value='';selectedTable=null;selectedRelation=null;render();fitView();renderGuide()};document.querySelector('#showAll').onclick=()=>{search.value='';selectedTable=null;selectedRelation=null;document.querySelector('#relations').checked=true;applySearch();fitView();renderGuide()};document.querySelector('#guide').onclick=renderGuide;document.querySelector('#panelToggle').onclick=e=>{const closed=workspace.classList.toggle('panel-closed');e.currentTarget.setAttribute('aria-expanded',String(!closed));e.currentTarget.textContent=closed?'Mostrar panel':'Ocultar panel'};search.addEventListener('input',()=>{const result=applySearch();if(result.matches.size===1)selectedRelation=null;tourButton.disabled=!selectedTable||!MODEL.relationships.some(r=>r.sourceTable===selectedTable||r.targetTable===selectedTable)});document.querySelector('#relations').addEventListener('change',applySearch);render();renderGuide();requestAnimationFrame(()=>fitView());if('ResizeObserver'in window){new ResizeObserver(()=>{if(autoFit)fitView()}).observe(canvas)}
</script></body></html>
